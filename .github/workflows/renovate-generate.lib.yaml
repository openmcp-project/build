name: Renovate Generate (lib)

on:
  workflow_call:
    inputs:
      app_id:
        description: 'GitHub App ID for creating a GitHub App token'
        required: false
        default: 1312871 # opencontrolplane-ci GitHub App
        type: string
      github-environment:
        description: 'Optionally define GitHub environment. By default, no GitHub environment is used.'
        required: false
        default: "release"
        type: string
    secrets:
      app_private_key:
        description: 'GitHub App private key for creating a GitHub App token.'
        required: false


permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-26.04
    environment: ${{ inputs.github-environment }}
    steps:
      - name: Create GitHub App token
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3
        id: app-token
        with:
          app-id: ${{ inputs.app_id }}
          private-key: ${{ case( secrets.app_private_key != '', secrets.app_private_key, secrets.OPENCONTROLPLANE_CI_PEM_FILE ) }}

      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          submodules: recursive
          ref: ${{ github.ref_name }}
          token: ${{ steps.app-token.outputs.token }}
          persist-credentials: false

      - name: Set up Go
        uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7
        with:
          go-version-file: go.mod

      - name: Install Task
        uses: arduino/setup-task@c0bc642852239c2689f73f4ea6459c29405f3c52 # v3.0.0
        with:
          version: 3.x
          repo-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Run task generate
        run: task generate --verbose

      - name: Create signed commit for generated files
        env:
          BRANCH: ${{ github.ref_name }}
          COMMIT_HEADLINE: "chore: regenerate after dependency update"
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
        run: |
          git add -A
          script=.github/scripts/create-signed-commit.sh
          if [[ -x hack/common/.github/scripts/create-signed-commit.sh ]]; then
            script=hack/common/.github/scripts/create-signed-commit.sh
          fi
          "$script"
