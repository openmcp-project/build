name: Semantic release

on:
  workflow_call:
    inputs:
      app_id:
        description: 'GitHub App ID for creating a GitHub App token'
        required: false
        default: 1312871 # OpenMCP CI GitHub App
        type: string
      is_cli:
        description: 'Build and attach CLI binaries to the prepared draft.'
        required: false
        default: false
        type: boolean
      runner:
        description: 'Runner label for the release job.'
        required: false
        default: ubuntu-26.04
        type: string
      use_github_token:
        description: 'Use the caller GITHUB_TOKEN instead of a GitHub App token.'
        required: false
        default: false
        type: boolean
      install_task:
        description: 'Install Task instead of using a Task binary already available on the runner.'
        required: false
        default: true
        type: boolean
      github-environment:
        description: 'Optional GitHub environment, including any required release approvals.'
        required: false
        default: ""
        type: string
    secrets:
      app_private_key:
        description: 'GitHub App private key for creating a GitHub App token.'
        required: false

permissions:
  contents: write

concurrency:
  group: ${{ github.repository }}-semantic-release
  cancel-in-progress: false

jobs:
  release:
    name: ${{ github.event_name == 'release' && 'Process published release' || 'Update draft release' }}
    runs-on: ${{ inputs.runner }}
    environment: ${{ inputs.github-environment }}
    steps:
      - name: Require main push or published release
        env:
          RELEASE_REF: ${{ github.ref }}
          RELEASE_EVENT: ${{ github.event_name }}
          RELEASE_ACTION: ${{ github.event.action }}
        run: |
          if [ "$RELEASE_EVENT" = release ]; then
            test "$RELEASE_ACTION" = published
          else
            test "$RELEASE_EVENT" = push
            test "$RELEASE_REF" = refs/heads/main
          fi

      - name: Create GitHub App token
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3
        id: app-token
        if: ${{ ! inputs.use_github_token }}
        with:
          app-id: ${{ inputs.app_id }}
          private-key: ${{ secrets.app_private_key }}

      - name: Checkout latest main
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: main
          token: ${{ inputs.use_github_token && github.token || steps.app-token.outputs.token }}
          fetch-depth: 0
          submodules: recursive

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version-file: go.mod

      - name: Install Task
        if: ${{ inputs.install_task }}
        uses: arduino/setup-task@c0bc642852239c2689f73f4ea6459c29405f3c52 # v3.0.0
        with:
          version: 3.x
          repo-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Prepare draft or process publication
        env:
          GH_TOKEN: ${{ inputs.use_github_token && github.token || steps.app-token.outputs.token }}
          RELEASE_EVENT: ${{ github.event_name }}
          RELEASE_ID: ${{ github.event.release.id }}
          IS_CLI: ${{ inputs.is_cli }}
        run: |
          args=(draft)
          if [ "$RELEASE_EVENT" = release ]; then
            args=(post-publish --release-id "$RELEASE_ID")
          fi
          if [ "$IS_CLI" = true ]; then args+=(--is-cli); fi
          node hack/common/release.cjs "${args[@]}"
