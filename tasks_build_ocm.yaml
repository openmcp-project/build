version: 3

includes:
  tools:
    taskfile: tasks_tools.yaml
    internal: true

tasks:
  # This is a dummy task that serves as a separator between task namespaces in the 'task -l' output.
  "---":
    desc: "{{.BLD_OCM_SEP}}"
    cmds:
    - cmd: echo "{{.SEP_MSG}}"
      silent: true

  all:
    desc: "  Builds and pushes the OCM component."
    run: once
    cmds:
    - task: build
    - task: push

  build:
    desc: "  Render the constructor template and build the OCM component."
    run: once
    dir: '{{.ROOT_DIR2}}'
    deps:
    - tools:ocm
    - tools:spiff
    - tools:jq
    - tools:localtmp
    requires:
      vars:
      - COMPONENTS
      - VERSION
      - MODULE_NAME
      - REPO_URL
    vars:
      CHART_REGISTRY:
        sh: 'PROJECT_ROOT="{{.ROOT_DIR2}}" "{{.TASKFILE_DIR2}}/get-registry.sh" --helm'
      IMAGE_REGISTRY:
        sh: 'PROJECT_ROOT="{{.ROOT_DIR2}}" "{{.TASKFILE_DIR2}}/get-registry.sh" --image'
      compdir: '{{.LOCALTMP}}/component'
    env:
      VERSION: '{{.VERSION}}'
      MODULE_NAME: '{{.MODULE_NAME}}'
      REPO_URL: '{{.REPO_URL}}'
      COMMIT: '{{.COMMIT | default ( .GIT_COMMIT | default "" )}}'
      COMPONENTS: '{{.COMPONENTS | trimSuffix " " | replace " " ","}}'
      CHART_REGISTRY: '{{.CHART_REGISTRY}}'
      IMG_REGISTRY: '{{.IMAGE_REGISTRY}}'
      CD_VERSION: '{{.CD_VERSION | default ""}}'
      CHART_VERSION: '{{.CHART_VERSION | default ""}}'
      IMG_VERSION: '{{.IMG_VERSION | default ""}}'
      BP_PATH: '{{.BP_PATH | default ""}}'
      BP_COMPONENTS: '{{.BP_COMPONENTS | default ""}}'
      CHART_COMPONENTS: '{{.CHART_COMPONENTS | default ""}}'
      IMG_COMPONENTS: '{{.IMG_COMPONENTS | default ""}}'
      CRDS_COMPONENTS: '{{.CRDS_COMPONENTS | default "[]"}}'
      CRDS_VERSION: '{{.CRDS_VERSION | default ""}}'
      CRDS_PATH: '{{.CRDS_PATH | default ""}}'
      CONSTRUCTOR_BASE_DIR: '{{.TASKFILE_DIR2}}'
      CONSTRUCTOR_FILE: '{{.LOCALTMP}}/component-constructor.yaml'
      ROOT_DIR2: '{{.ROOT_DIR2}}'
      LOCALTMP: '{{.LOCALTMP}}'
      OCM_COMPONENT_DIR: '{{.compdir}}'
    cmds:
    # Binding files preserve strings containing '=' or leading zeros, unlike spiff -D.
    - |
      "{{.JQ}}" -n '{values: (env | {
        VERSION, MODULE_NAME, REPO_URL, COMMIT, COMPONENTS,
        CHART_REGISTRY, IMG_REGISTRY, CD_VERSION, CHART_VERSION, IMG_VERSION,
        BP_PATH, BP_COMPONENTS, CHART_COMPONENTS, IMG_COMPONENTS,
        CRDS_COMPONENTS, CRDS_VERSION, CRDS_PATH, CONSTRUCTOR_BASE_DIR
      })}' > "$LOCALTMP/component-values.json"
    - '"{{.SPIFF}}" merge --features control,interpolation --bindings "$LOCALTMP/component-values.json" "{{.TASKFILE_DIR2}}/components.yaml" > "$CONSTRUCTOR_FILE"'
    # Transferring the whole archive must not republish versions left by earlier builds.
    - 'rm -rf -- "$OCM_COMPONENT_DIR"'
    - '"{{.OCM}}" add cv --constructor "$CONSTRUCTOR_FILE" --repository "ctf::$OCM_COMPONENT_DIR" --working-directory "$ROOT_DIR2" --blob-cache-directory "$LOCALTMP/ocm-cache"'
    - cmd: echo "Use '$(realpath --relative-base="{{.USER_WORKING_DIR}}" "{{.OCM}}") get cv $(realpath --relative-base="{{.USER_WORKING_DIR}}" "{{.compdir}}") -o yaml' to view the generated component descriptor."
      silent: true

  push:
    desc: "  Push the OCM component to the registry. Existing versions are replaced unless registry policy prevents it."
    run: once
    deps:
    - tools:ocm
    requires:
      vars:
      - VERSION
      - LOCALTMP
    vars:
      COMPONENT_REGISTRY:
        sh: 'PROJECT_ROOT="{{.ROOT_DIR2}}" "{{.TASKFILE_DIR2}}/get-registry.sh" --component'
      compdir: '{{.LOCALTMP}}/component'
    env:
      OCM_SOURCE: 'ctf::{{.compdir}}'
      OCM_TARGET: '{{.COMPONENT_REGISTRY}}'
    cmds:
    - '"{{.OCM}}" transfer cv "$OCM_SOURCE" "$OCM_TARGET"'
