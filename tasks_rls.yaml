version: 3

includes:
  clibuild:
    taskfile: tasks_cli_build.yaml
    internal: true

tasks:
  # This is a dummy task that serves as a separator between task namespaces in the 'task -l' output.
  "---":
    desc: "{{.RLS_SEP}}"
    cmds:
    - cmd: echo "{{.SEP_MSG}}"
      silent: true

  patch:
    desc: "  Explains how to review the semantic draft and publish it in GitHub Releases."
    run: once
    cmds:
    - task: release-internal

  minor:
    desc: "  Explains how to review the semantic draft and publish it in GitHub Releases."
    run: once
    cmds:
    - task: release-internal

  major:
    desc: "  Explains how to review the semantic draft and publish it in GitHub Releases."
    run: once
    cmds:
    - task: release-internal

  prepare-dev-cycle:
    desc: "  Explains the automated development-version restoration after publishing a release."
    run: once
    cmds:
    - task: release-internal

  release-internal:
    desc: "  Explains the semantic draft and GitHub Releases publication process without changing files."
    run: once
    vars:
      RELEASES_URL:
        sh: |
          repo_url='{{.REPO_URL | default ""}}'
          if [ -z "$repo_url" ]; then
            repo_url=$(git -C "{{.ROOT_DIR2}}" remote get-url origin 2>/dev/null || true)
            case "$repo_url" in
              git@*:* ) repo_url=${repo_url#git@}; repo_url="https://${repo_url%%:*}/${repo_url#*:}" ;;
              ssh://git@* ) repo_url="https://${repo_url#ssh://git@}" ;;
            esac
          fi
          repo_url=${repo_url%/}
          repo_url=${repo_url%.git}
          case "$repo_url" in
            https://*|http://*) printf '%s/releases\n' "$repo_url" ;;
            *) printf '%s\n' 'the current repository Releases page (set REPO_URL to show its URL)' ;;
          esac
    cmds:
    - cmd: |
        printf '%s\n' \
          'Merges to main update a prepared semantic draft release; local version bumps are no longer used.' \
          'Review the draft at {{.RELEASES_URL}}.' \
          'To publish: GitHub Releases > open the draft > Publish.' \
          'VERSION, charts and nested-module references are prepared on a release-candidate source branch before Publish; main stays untouched while drafting.' \
          'The published event merges the exact tagged release into main, then creates a separate development VERSION commit; published tags stay on their original SHA.' \
          'No local files or commits were changed.'
      silent: true
    internal: true

  set-version:
    desc: '  Updates all versions to the specified version. Usage: task {{.TASK}} -- <version>'
    summary: |
      This task prepares candidate source and sets the development VERSION after merging the published release.
      It sets the following versions to the one provided as argument:
      - the VERSION file in the root directory
      - 'version' in the Chart.yaml file of each component's helm chart
      - 'appVersion' in the Chart.yaml file of each component's helm chart
      - 'tag' in the values.yaml file of each component's helm chart
      - the imported version of each nested module in the root go.mod file
    run: once
    preconditions:
    - sh: 'test "{{len .CLI_ARGS}}" -gt 0'
      msg: 'This task requires a version argument. Usage: task {{.TASK}} -- <version>'
    vars:
      VERSION: '{{.CLI_ARGS | splitList " " | first}}'
    cmds:
    - 'echo -n "{{.VERSION}}" > "{{.ROOT_DIR2}}/VERSION"'
    - if: '[[ ! "{{.VERSION}}" =~ .*-dev(-[0-9a-f]*)? ]]' # only set chart versions for release versions (without '-dev' suffix)
      for:
        var: COMPONENTS
      vars:
        COMPONENT: '{{.ITEM}}'
        VERSION: '{{.VERSION}}'
      task: set-chart-version-internal
    - if: '[[ ! "{{.VERSION}}" =~ .*-dev(-[0-9a-f]*)? ]]' # only set nested module versions for release versions (without '-dev' suffix)
      for:
        var: NESTED_MODULES
      vars:
        MODULE: '{{.ITEM}}'
        VERSION: '{{.VERSION}}'
      task: set-module-version-internal

  set-chart-version-internal:
    desc: "  Sets the versions in the helm chart for a specific component."
    run: always
    requires:
      vars:
      - VERSION
      - COMPONENT
    if: 'test -f "{{.ROOT_DIR2}}/charts/{{.COMPONENT}}/Chart.yaml"'
    cmds:
    - '{{.TASKFILE_DIR2}}/sed.sh -E "s@version: v?[[:digit:]]+\.[[:digit:]]+\.[[:digit:]]+.*@version: {{.VERSION}}@1" "{{.ROOT_DIR2}}/charts/{{.COMPONENT}}/Chart.yaml"'
    - '{{.TASKFILE_DIR2}}/sed.sh -E "s@appVersion: v?[[:digit:]]+\.[[:digit:]]+\.[[:digit:]]+.*@appVersion: {{.VERSION}}@1" "{{.ROOT_DIR2}}/charts/{{.COMPONENT}}/Chart.yaml"'
    - '{{.TASKFILE_DIR2}}/sed.sh -E "s@  tag: .*@  tag: {{.VERSION}}@" "{{.ROOT_DIR2}}/charts/{{.COMPONENT}}/values.yaml"'
    internal: true

  set-module-version-internal:
    desc: "  Sets the imported version of a nested module in the root go.mod file."
    run: always
    requires:
      vars:
      - VERSION
      - MODULE
    if: 'test -f "{{.ROOT_DIR2}}/{{.MODULE}}/go.mod"'
    vars:
      MODULE_PATH:
        sh: |
          if [ -f "{{.ROOT_DIR2}}/{{.MODULE}}/go.mod" ]; then
            sed -nE 's/^module[[:blank:]]+([^[:blank:]]+).*/\1/p' "{{.ROOT_DIR2}}/{{.MODULE}}/go.mod"
          fi
    cmds:
    - '{{.TASKFILE_DIR2}}/sed.sh -E "s@^([[:blank:]]*|require[[:blank:]]+)({{regexQuoteMeta .MODULE_PATH}})[[:blank:]]+v[^[:blank:]]+@\1\2 {{.VERSION}}@" "{{.ROOT_DIR2}}/go.mod"'
    - for:
        var: NESTED_MODULES
      vars:
        MODULE_TO_UPDATE: '{{.MODULE}}'
        MODULE_DEPENDENCY: '{{.ITEM}}'
        VERSION: '{{.VERSION}}'
      task: set-nested-module-version-internal
    internal: true

  set-nested-module-version-internal:
    desc:  "  Sets the imported version of a nested module in a nested go.mod file."
    run: always
    requires:
      vars:
      - MODULE_TO_UPDATE
      - MODULE_DEPENDENCY
      - VERSION
    if: 'test -f "{{.ROOT_DIR2}}/{{.MODULE_TO_UPDATE}}/go.mod" && test -f "{{.ROOT_DIR2}}/{{.MODULE_DEPENDENCY}}/go.mod"'
    vars:
      MODULE_PATH:
        sh: |
          if [ -f "{{.ROOT_DIR2}}/{{.MODULE_DEPENDENCY}}/go.mod" ]; then
            sed -nE 's/^module[[:blank:]]+([^[:blank:]]+).*/\1/p' "{{.ROOT_DIR2}}/{{.MODULE_DEPENDENCY}}/go.mod"
          fi
    cmds:
    - '{{.TASKFILE_DIR2}}/sed.sh -E "s@^([[:blank:]]*|require[[:blank:]]+)({{regexQuoteMeta .MODULE_PATH}})[[:blank:]]+v[^[:blank:]]+@\1\2 {{.VERSION}}@" "{{.ROOT_DIR2}}/{{.MODULE_TO_UPDATE}}/go.mod"'
    internal: true

  list-nested-modules:
    desc: "List configured nested Go modules that have a go.mod file."
    cmds:
    - for:
        var: NESTED_MODULES
      cmd: 'if [ -f "{{.ROOT_DIR2}}/{{.ITEM}}/go.mod" ]; then printf "%s\n" "{{.ITEM}}"; fi'
      silent: true

  generate-changelog:
    desc: "  Generates an automated release changelog based on conventional-commits PR titles in CHANGELOG.md file."
    run: once
    requires:
      vars:
      - VERSION
    cmds:
    -  'VERSION={{.VERSION}} {{.TASKFILE_DIR2}}/generate-changelog.sh'

  artifacts:
    desc: "  Creates the artifacts to be attached to a github release. Basically tar archives of the built binaries for each platform. Outputs them to bin/release. CLI only."
    run: once
    requires:
      vars:
      - NAME
      - VERSION
      - ALL_OS
      - ALL_ARCH
    vars:
      VERSION_NO_PREFIX: '{{regexReplaceAll "^[vV]" .VERSION ""}}'
    if: '{{ .IS_CLI | default false }}' # only run this task for CLI repos
    deps:
    - clibuild:bin-multi-raw
    cmds:
    - 'rm -rf {{.ROOT_DIR2}}/bin/release && mkdir -p {{.ROOT_DIR2}}/bin/release'
    - for:
        matrix:
          OS:
            ref: .ALL_OS
          ARCH:
            ref: .ALL_ARCH
      cmd: 'rm -f "{{.ROOT_DIR2}}/bin/{{.NAME}}" && mv "{{.ROOT_DIR2}}/bin/{{.NAME}}.{{.ITEM.OS}}-{{.ITEM.ARCH}}" "{{.ROOT_DIR2}}/bin/{{.NAME}}" && tar -czf "{{.ROOT_DIR2}}/bin/release/{{.NAME}}-{{.VERSION_NO_PREFIX}}-{{.ITEM.OS}}-{{.ITEM.ARCH}}.tar.gz" -C "{{.ROOT_DIR2}}/bin" {{.NAME}}'
